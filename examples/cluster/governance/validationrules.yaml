# Password rules. When you delete the managed resource, the provider restores the server's
# default rules.
apiVersion: governance.wso2is.crossplane.io/v1alpha1
kind: ValidationRules
metadata:
  name: password
spec:
  forProvider:
    field: password
    rules:
      - validator: LengthValidator
        properties:
          min.length: "12"
          max.length: "64"
      - validator: NumeralValidator
        properties:
          min.length: "1"
      - validator: UpperCaseValidator
        properties:
          min.length: "1"
      - validator: LowerCaseValidator
        properties:
          min.length: "1"
      - validator: SpecialCharacterValidator
        properties:
          min.length: "1"
