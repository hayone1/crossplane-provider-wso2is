# The server's SAML identity provider metadata. When you delete the managed resource, the
# provider restores the server defaults.
apiVersion: config.wso2is.crossplane.io/v1alpha1
kind: SAMLIdPConfiguration
metadata:
  name: saml-idp
spec:
  forProvider:
    enableMetadataSigning: true
    metadataValidityPeriod: 120
