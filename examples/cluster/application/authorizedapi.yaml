# A machine-to-machine (M2M) application that may call the Orders API with two scopes.
apiVersion: application.wso2is.crossplane.io/v1alpha1
kind: AuthorizedAPI
metadata:
  name: order-processor-orders
spec:
  forProvider:
    applicationIdRef:
      name: order-processor
    apiResourceIdRef:
      name: order-processor-api
    scopes:
      - orders:read
      - orders:write
---
apiVersion: application.wso2is.crossplane.io/v1alpha1
kind: Application
metadata:
  name: order-processor
spec:
  forProvider:
    name: Order Processor
    oidc:
      grantTypes:
        - client_credentials
---
apiVersion: application.wso2is.crossplane.io/v1alpha1
kind: APIResource
metadata:
  name: order-processor-api
spec:
  forProvider:
    name: Order Processor API
    identifier: https://api.example.com/order-processor
    scopes:
      - name: orders:read
        displayName: Read orders
      - name: orders:write
        displayName: Change orders
