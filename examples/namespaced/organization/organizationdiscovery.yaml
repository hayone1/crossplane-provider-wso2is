# The email domains of an organization's users. Email domain discovery must be on, so this
# file turns it on too. Delete the OrganizationDiscovery before the configuration.
apiVersion: organization.wso2is.m.crossplane.io/v1alpha1
kind: OrganizationDiscovery
metadata:
  namespace: default
  name: domains-partner
spec:
  forProvider:
    organizationIdRef:
      name: domains-partner
    emailDomains:
      - partner.example
      - partner-eu.example
---
apiVersion: organization.wso2is.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  namespace: default
  name: domains-partner
spec:
  forProvider:
    name: Domains Partner Inc
---
apiVersion: organization.wso2is.m.crossplane.io/v1alpha1
kind: OrganizationDiscoveryConfiguration
metadata:
  namespace: default
  name: discovery-for-domains
spec:
  forProvider:
    emailDomainEnabled: true
