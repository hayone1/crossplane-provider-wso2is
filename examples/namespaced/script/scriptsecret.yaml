# A secret that adaptive authentication scripts read as secrets.risk_api_key. The value
# comes from a Kubernetes Secret.
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: risk-api-key
stringData:
  value: replace-with-your-api-key
---
apiVersion: script.wso2is.m.crossplane.io/v1alpha1
kind: ScriptSecret
metadata:
  namespace: default
  name: risk-api-key
spec:
  forProvider:
    name: risk_api_key
    description: The API key of the risk service
    valueSecretRef:
      name: risk-api-key
      key: value
