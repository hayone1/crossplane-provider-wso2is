name: End to End (WSO2 in Docker)

# Tests every example against a real WSO2 Identity Server 7.3.0 that runs in Docker next to a
# kind cluster. The provider runs outside the cluster, so it reaches the server at
# localhost:9443. The job needs no secrets and no paid server.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scope: [cluster, namespaced]
    services:
      wso2is:
        image: wso2/wso2is:7.3.0
        ports:
          - 9443:9443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      - name: Wait for WSO2 Identity Server
        run: |
          for i in $(seq 1 90); do
            if curl -sk -o /dev/null -w '%{http_code}' https://localhost:9443/api/health-check/v1.0/health | grep -q 200; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::WSO2 Identity Server did not start"
          exit 1

      - name: Run the examples
        env:
          WSO2IS_BASE_URL: https://localhost:9443
          WSO2IS_USERNAME: admin
          WSO2IS_PASSWORD: admin
          WSO2IS_INSECURE_SKIP_VERIFY: "true"
          POLL: 15s
          IDLE: 25s
          E2E_LOG: ${{ runner.temp }}/provider.log
        run: |
          mapfile -t manifests < <(find examples/${{ matrix.scope }} -name '*.yaml' ! -path '*/providerconfig/*' | sort)
          test/e2e/run.sh "${manifests[@]}"

      - name: Upload the provider log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-log-${{ matrix.scope }}
          path: ${{ runner.temp }}/provider.log
