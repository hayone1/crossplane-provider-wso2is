version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
    # The Terraform plugin libraries must stay compatible with both Upjet and
    # terraform-provider-wso2is. They move when one of those two modules
    # moves.
    ignore:
      - dependency-name: github.com/hashicorp/terraform-plugin-sdk/v2
      - dependency-name: github.com/hashicorp/terraform-plugin-go
      - dependency-name: github.com/hashicorp/terraform-plugin-framework
    groups:
      # Bumped together with TERRAFORM_PROVIDER_VERSION and `make generate`.
      terraform-provider:
        patterns: [github.com/hayone1/terraform-provider-wso2is]
      go:
        patterns: ['*']
        exclude-patterns: [github.com/hayone1/terraform-provider-wso2is]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # The WSO2 Identity Server image in compose.yaml. The provider targets WSO2 IS 7.3, so only
  # patch releases are proposed; a new minor version needs its own testing.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: test
    ignore:
      - dependency-name: wso2/wso2is
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Keeps the digest-pinned distroless base image current.
  - package-ecosystem: docker
    directory: /cluster/images/provider-wso2is
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
