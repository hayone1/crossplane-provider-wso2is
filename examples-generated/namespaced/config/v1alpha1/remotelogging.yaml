apiVersion: config.wso2is.m.crossplane.io/v1alpha1
kind: RemoteLogging
metadata:
  annotations:
    meta.upbound.io/example-id: config/v1alpha1/remotelogging
  labels:
    testing.upbound.io/example-name: audit
  name: audit
  namespace: default
spec:
  forProvider:
    connectTimeoutMillis: "5000"
    logType: AUDIT
    passwordSecretRef:
      key: example-key
      name: example-secret
    remoteUrl: https://logs.example.com/wso2is/audit
    username: wso2is
