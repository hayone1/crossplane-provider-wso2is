apiVersion: organization.wso2is.crossplane.io/v1alpha1
kind: UserShare
metadata:
  annotations:
    meta.upbound.io/example-id: organization/v1alpha1/usershare
  labels:
    testing.upbound.io/example-name: support
  name: support
spec:
  forProvider:
    organizations:
    - includeChildren: true
      organizationIdSelector:
        matchLabels:
          testing.upbound.io/example-name: partner
      roles:
      - audienceName: Customer Portal
        audienceType: application
        name: order-admins
    userIdSelector:
      matchLabels:
        testing.upbound.io/example-name: support

---

apiVersion: application.wso2is.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: organization/v1alpha1/usershare
  labels:
    testing.upbound.io/example-name: portal
  name: portal
spec:
  forProvider:
    associatedRoles:
      allowedAudience: APPLICATION
    name: Partner Portal
    oidc:
      callbackUrls:
      - https://portal.example.com/callback
      grantTypes:
      - authorization_code

---

apiVersion: application.wso2is.crossplane.io/v1alpha1
kind: ApplicationShare
metadata:
  annotations:
    meta.upbound.io/example-id: organization/v1alpha1/usershare
  labels:
    testing.upbound.io/example-name: portal
  name: portal
spec:
  forProvider:
    applicationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: portal
    organizationIdsRefs:
    - name: partner

---

apiVersion: organization.wso2is.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: organization/v1alpha1/usershare
  labels:
    testing.upbound.io/example-name: partner
  name: partner
spec:
  forProvider:
    name: Partner Inc

---

apiVersion: identity.wso2is.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: organization/v1alpha1/usershare
  labels:
    testing.upbound.io/example-name: support_agent
  name: support-agent
spec:
  forProvider:
    audienceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: portal
    audienceType: application
    name: support-agent

---

apiVersion: identity.wso2is.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: organization/v1alpha1/usershare
  labels:
    testing.upbound.io/example-name: support
  name: support
spec:
  forProvider:
    email: sam@example.com
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    username: sam
