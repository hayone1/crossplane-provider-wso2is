apiVersion: userstore.wso2is.crossplane.io/v1alpha1
kind: UserStore
metadata:
  annotations:
    meta.upbound.io/example-id: userstore/v1alpha1/userstore
  labels:
    testing.upbound.io/example-name: customers
  name: customers
spec:
  forProvider:
    description: Customer accounts
    name: CUSTOMERS
    properties:
      driverName: org.postgresql.Driver
      url: jdbc:postgresql://db.example.com:5432/customers
      userName: wso2
    secretPropertiesSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    type: UniqueIDJDBCUserStoreManager

---

apiVersion: identity.wso2is.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: userstore/v1alpha1/userstore
  labels:
    testing.upbound.io/example-name: customer
  name: customer
spec:
  forProvider:
    email: jane@example.com
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    userStoreSelector:
      matchLabels:
        testing.upbound.io/example-name: customers
    username: jane
