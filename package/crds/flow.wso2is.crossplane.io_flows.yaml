        description: Flow is the Schema for the Flows API. Manages a flow that the
          Console's flow builder can also edit (WSO2 IS 7.2 and later). A flow is
          the self sign-up form and its steps, the password recovery flow, or the
          invited user registration flow. Use this resource to build a custom sign-up
          form. In a flow, form fields map to claims, and executors do the work of
          each step. Examples of executors are PasswordProvisioningExecutor, EmailOTPExecutor,
          UserProvisioningExecutor and federated executors such as GoogleExecutor.
          steps holds the same JSON document that the Console stores (GET /api/server/v1/flow?flowType=...).
          You can design the flow in the Console and copy its JSON from that API,
          or write the JSON yourself. When you delete the managed resource, the provider
          turns the flow off and deletes it. By default, WSO2 IS 7.3.0 does not allow
          the API to delete the root organization's flow. In that case, the provider
          only turns the flow off. The server behaviour guide explains how to allow
          deletion. If the object already exists, the managed resource takes it over.
