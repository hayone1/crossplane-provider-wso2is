        description: IdentityProvider is the Schema for the IdentityProviders API.
          Manages an identity provider, which the Console calls a connection. An identity
          provider lets users sign in with another system. Examples are social logins
          (Google, GitHub, Facebook, Microsoft and Apple) and any OpenID Connect or
          SAML provider. The resource also manages claim and role mappings, just-in-time
          provisioning and outbound provisioning. Authenticator and connector settings
          are properties with the names that the server uses. The wso2is_federated_authenticator_metadata
          data source lists them. The provider only manages the property keys that
          you set. Put secrets in secret_properties, so that plans hide them. To use
          the identity provider for login, add it to an application's authentication_sequence.
          To manage an existing object, set the crossplane.io/external-name annotation
          to its ID.
