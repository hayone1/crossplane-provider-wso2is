          This resource does not work in the super tenant (carbon.super). The super
          tenant reads its email provider only from deployment.toml ([output_adapter.email]),
          and the API answers HTTP 405. Use this resource with a provider that manages
          another tenant. The setting exists once per tenant, so manage it with only
          one managed resource.
