          Templates use placeholders, such as {{user-name}}, {{confirmation-code}},
          {{organization-name}} and {{ url:...}}. Template types include AccountConfirmation,
          AskPassword, PasswordReset, passwordResetSucess, ResendAccountConfirmation,
          EmailOTP, SMSOTP, AccountLockFailedAttempt, AccountUnlockAdmin, AccountDisable,
          OrganizationUserInvitation, magicLink and TemporaryPassword. You can also
          use your own types from NotificationTemplateType. If the object already
          exists, the managed resource takes it over.
